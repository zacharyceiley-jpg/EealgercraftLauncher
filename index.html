<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eaglercraft Launcher</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" media="screen and (max-width:1100px)" href="./css/screensize.css">
<link rel="shortcut icon" href="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="theme-color" content="#303030">
</head><body>
<div class="sidebar" id="sidebar">
<div class="sidebarOptionsTop active" data-category="web"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/i-web.png" width="30" alt=""><div class="gTabsText"><p class="eaglercraftText">EAGLERCRAFT :</p><p>Web Edition</p></div></div>
<div class="sidebarOptionsTop" data-category="modded"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/i-modded.png" width="30" alt=""><div class="gTabsText"><p class="eaglercraftText">EAGLERCRAFT :</p><p>Modded Editions</p></div></div>
<div class="sidebarOptionsTop" data-category="mobile"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/i-controls.png" width="30" alt=""><div class="gTabsText"><p class="eaglercraftText">EAGLERCRAFT :</p><p>Mobile/Controller</p></div></div>
<div class="sidebarOptionsTop" data-category="servers"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/i-servers.png" width="30" alt=""><div class="gTabsText"><p class="eaglercraftText">EAGLERCRAFT :</p><p>Servers</p></div></div>
<div class="sidebarOptionsTop" data-category="live"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/i-live.png" width="30" alt=""><div class="gTabsText"><p class="eaglercraftText">EAGLERCON :</p><p>Live</p></div></div>
<div class="sidebarOptionsBottom" style="bottom:6rem"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/m-credits.png" width="25" alt=""><div class="gTabsText"><p>Credits</p></div></div>
<div class="sidebarOptionsBottom"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/m-settings.png" width="25" alt=""><div class="gTabsText"><p>Settings</p></div></div>
<div class="launcherVersion"><p>EealgercraftLauncher</p></div>
</div>
<main class="mainPage">
<header class="gameHeader"><p id="categoryTitle" class="currentGame bolded">EAGLERCRAFT WEB EDITION</p>
<ul class="gameTabs"><li id="playTab" class="headerButtonSelected" onclick="closeInfoPage()">Play</li><li class="headerButtons">DLC</li><li id="faqTab" class="headerButtons" onclick="openFAQ()">FAQ</li><li class="headerButtons">Installations</li><li class="headerButtons">Skins</li><li id="changelogTab" class="headerButtons" onclick="openChangelog()">Changelog</li></ul></header>
<section id="game-bg" class="gameBg"><div class="gameLogo"><img src="https://raw.githubusercontent.com/zacharyceiley-jpg/EalgerLauncher/main/images/web-title.png" alt="Eaglercraft"></div></section>
<section class="gameSelection" id="gameSelection">
  <div class="versionSelector">
    <button class="dropdownSelector" id="versionDropdown" type="button" aria-expanded="false">
      <span class="dropdownOption">
        <img id="selectedVersionIcon" src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/c/c3/Expressionless_Sulfur_Face.png/revision/latest/scale-to-width-down/62?cb=20260415024809" alt="" width="32" height="32">
        <span class="dropdownOptionText"><strong id="selectedVersionName">26.2</strong><small id="selectedVersionCategory">Web Edition</small></span>
      </span>
      <span class="dropdownChevron">⌄</span>
    </button>
    <div class="dropdownMenu" id="versionMenu" hidden>
      <button class="dropdownOptions" type="button" data-version="26.2">
        <span class="dropdownOption">
          <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/c/c3/Expressionless_Sulfur_Face.png/revision/latest/scale-to-width-down/62?cb=20260415024809" alt="" width="32" height="32">
          <span class="dropdownOptionText"><strong>26.2</strong><small>Web Edition</small></span>
        </span>
      </button>
    </div>
  </div>
  <a class="playButton" id="playButton" href="https://verybrobro.github.io/Eaglercraft-26.2/" aria-label="Play Eaglercraft 26.2"></a>
</section>
<section id="infoPanel" class="infoPanel" aria-live="polite" style="display:none"><div id="infoContent" class="infoContent"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script><script src="./js/index.js?v=7"></script><script src="./js/changelog.js"></script></body></html>
